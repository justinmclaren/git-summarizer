name: "Git Weekly Summary Action"
description: "Generate and send weekly summaries of code changes to Slack using OpenAI"
author: "Gentrace"

inputs:
  openai_api_key:
    description: "OpenAI API key for generating summaries"
    required: true
  slack_bot_token:
    description: "Slack Bot Token for sending messages"
    required: true
  slack_channel:
    description: "Slack channel ID (e.g., C088V1U72BC)"
    required: true
  days_to_analyze:
    description: "Number of days of history to analyze"
    required: false
    default: "7"
  model:
    description: "OpenAI model to use for summarization"
    required: false
    default: "o1"

runs:
  using: "composite"
  steps:
    - uses: actions/checkout@v3
      with:
        fetch-depth: 0

    - uses: actions/setup-node@v3
      with:
        node-version: "18"

    - name: Create Script
      shell: bash
      run: |
        # Create temp directory that will be automatically cleaned up
        TEMP_DIR=$(mktemp -d)
        SCRIPT_PATH="$TEMP_DIR/summarize.cjs"

        # Create the script in temp directory
        cat > "$SCRIPT_PATH" << 'EOL'
        const https = require('https');
        const { execSync } = require('child_process');

        async function makeRequest(url, options, data) {
          return new Promise((resolve, reject) => {
            const req = https.request(url, options, (res) => {
              let responseData = '';
              res.on('data', (chunk) => { responseData += chunk; });
              res.on('end', () => resolve(JSON.parse(responseData)));
            });
            req.on('error', reject);
            if (data) req.write(JSON.stringify(data));
            req.end();
          });
        }

        async function main() {
          try {
            const daysToAnalyze = process.env.DAYS_TO_ANALYZE || "7";
            const lastWeekLog = execSync(
              `git log --since="${daysToAnalyze} days ago" --pretty=format:"%ad | %an | %s" --date=short --reverse`
            ).toString();

            if (!process.env.OPENAI_API_KEY) throw new Error('OPENAI_API_KEY environment variable is required');
            if (!process.env.SLACK_BOT_TOKEN) throw new Error('SLACK_BOT_TOKEN environment variable is required');
            if (!process.env.SLACK_CHANNEL) throw new Error('SLACK_CHANNEL environment variable is required');
            
            // Validate Slack channel ID format
            if (!/^[A-Z0-9]{9,}$/.test(process.env.SLACK_CHANNEL)) {
              throw new Error('SLACK_CHANNEL must be a valid Slack channel ID (e.g., C088V1U72BC)');
            }

            // Call OpenAI API
            const completion = await makeRequest('https://api.openai.com/v1/chat/completions', {
              method: 'POST',
              headers: {
                'Authorization': `Bearer ${process.env.OPENAI_API_KEY}`,
                'Content-Type': 'application/json'
              }
            }, {
              model: process.env.OPENAI_MODEL || 'o1',
              messages: [
                {
                  role: 'system',
                  content: 'You help an engineering team write weekly status updates for non-technical stakeholders (VPs, sales, recruiters, etc.).\n\nYou will receive a list of git commits. Each commit line has:\n- date | author name | commit message\n\nYour job:\n- Group the report by author.\n- For each author, write a short, business-friendly summary of what they delivered this period.\n- Focus on end-user and business impact (faster login, fewer errors, smoother navigation, better reporting, etc.).\n- Merge multiple related commits into 2–4 bullets per person (no 1:1 mapping to commits).\n- Avoid technical jargon and implementation details (no "refactor", "webhook", "Redis", etc.).\n- Ignore purely internal chores like version bumps or doc tweaks unless they clearly impact users or the business.\n\nOutput format (Slack markdown):\n- For each author:\n  * Line 1: the author name in *bold*, e.g. *Justin McLaren*\n  * Then 2–4 bullet points starting with "• "\n\nExample structure:\n\n*Justin McLaren*\n• Improved login speed so users can sign in faster and drop off less during onboarding.\n• Fixed minor UI issues in settings to make navigation clearer.\n\n*Alice Smith*\n• Added better reporting so leaders can see weekly activity at a glance.\n• Reduced errors in the application flow, improving reliability for customers.'
                },
                {
                  role: 'user',
                  content: `Here are the git commits for this period:\n\n${lastWeekLog}\n\nPlease group by author and create business-friendly summaries following the format specified.`
                }
              ]
            });

            const summary = completion.choices[0].message.content;
            console.log('Generated summary:', summary);

            // Send to Slack
            const repoUrl = execSync('git config --get remote.origin.url').toString().trim();
            const repoName = repoUrl.split('/').pop().replace('.git', '') || 'repository';

            await makeRequest('https://slack.com/api/chat.postMessage', {
              method: 'POST',
              headers: {
                'Authorization': `Bearer ${process.env.SLACK_BOT_TOKEN}`,
                'Content-Type': 'application/json'
              }
            }, {
              channel: process.env.SLACK_CHANNEL,
              text: `*Weekly Summary for ${repoName}*\n\n${summary}`,
              mrkdwn: true
            });

            console.log('Summary sent successfully to Slack!');
          } catch (error) {
            console.error('Error:', error);
            process.exit(1);
          }
        }

        main();
        EOL

        # Store the script path for the next step
        echo "SCRIPT_PATH=$SCRIPT_PATH" >> $GITHUB_ENV

    - name: Generate and Send Summary
      shell: bash
      env:
        OPENAI_API_KEY: ${{ inputs.openai_api_key }}
        SLACK_BOT_TOKEN: ${{ inputs.slack_bot_token }}
        SLACK_CHANNEL: ${{ inputs.slack_channel }}
        DAYS_TO_ANALYZE: ${{ inputs.days_to_analyze }}
        OPENAI_MODEL: ${{ inputs.model }}
      run: node $SCRIPT_PATH
